name: Rhabdomyolysis Aki Engine CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[api,test]"

    - name: Generate ephemeral test audit key
      run: echo "AUDIT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"

    - name: Compile Python sources
      run: python -m compileall -q agents rhabdomyolysis_aki_agent cli.py rhabdo_guard.py enrichment.py simulator.py

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Audit signature smoke check
      run: |
        python -c "
        from agents.base import AuditTrail
        trail = AuditTrail()
        trail.log('ci', 'test', 'VERIFY', {'status': 'test'})
        assert trail.verify_integrity()
        trail.logs[0]['actor'] = 'tampered'
        assert not trail.verify_integrity()
        print('Audit-signature smoke check passed')
        "
