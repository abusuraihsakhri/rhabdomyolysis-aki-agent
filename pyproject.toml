[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rhabdomyolysis-aki-engine"
version = "2.0.0"
description = "RhabdoGuard: Serum Creatine Kinase (CK) Kinetics & Myoglobinuria AKI Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
rhabdomyolysis-aki-engine = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/rhabdomyolysis-aki-agent"
Repository = "https://github.com/abusuraihsakhri/rhabdomyolysis-aki-agent.git"

[tool.setuptools]
py-modules = ["cli", "enrichment", "rhabdo_guard", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*", "rhabdomyolysis_aki_agent*"]
